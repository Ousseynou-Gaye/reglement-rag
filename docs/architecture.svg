<svg width="680" height="500" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Architecture du chatbot RAG - reglement pedagogique</title>
<desc>Client Postman/Swagger appelle un Controller REST, qui appelle un Service, lequel s'appuie sur un Repository JPA relie a PostgreSQL et sur un VectorStore pgvector relie a Ollama.</desc>
<rect width="680" height="500" fill="#faf8f4"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5b6270" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="260" y="30" width="160" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="52" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#2C2C2A">Client (Postman)</text>
<line x1="340" y1="74" x2="340" y2="118" stroke="#5b6270" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="250" y="120" width="180" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="142" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#042C53">Controller (REST)</text>
<line x1="340" y1="164" x2="340" y2="208" stroke="#5b6270" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="250" y="210" width="180" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="232" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#04342C">Service (orchestration)</text>
<line x1="340" y1="254" x2="225" y2="298" stroke="#5b6270" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="254" x2="430" y2="298" stroke="#5b6270" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="145" y="300" width="160" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="225" y="322" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#26215C">Repository (JPA)</text>
<line x1="225" y1="344" x2="220" y2="388" stroke="#5b6270" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="325" y="300" width="210" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="430" y="322" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#4A1B0C">VectorStore (pgvector)</text>
<line x1="430" y1="344" x2="432" y2="388" stroke="#5b6270" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="125" y="390" width="190" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="220" y="410" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#26215C">PostgreSQL</text>
<text x="220" y="430" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">documents, conversations</text>

<rect x="330" y="390" width="205" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="432" y="410" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#4A1B0C">Ollama</text>
<text x="432" y="430" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">embeddings + chat llama3.1</text>

<text x="340" y="475" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b6270">Chatbot RAG - Reglement pedagogique universitaire (Examen L3 DATA AI, Sujet 1)</text>
</svg>
